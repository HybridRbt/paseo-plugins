name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Type check and test every plugin
        run: |
          for dir in plugins/*/; do
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run typecheck && npm test)
            echo "::endgroup::"
          done
